services:
  - type: web
    name: coach-rickie-api
    env: node
    rootDir: apps/api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
  - type: worker
    name: coach-rickie-worker
    env: node
    rootDir: apps/api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/workers/notification.worker.js
  - type: web
    name: coach-rickie-web
    env: node
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
