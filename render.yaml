services:
  - type: web
    name: coach-rickie-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
  - type: web
    name: coach-rickie-web
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace=@coach-rickie/web
    startCommand: npm run start --workspace=@coach-rickie/web
